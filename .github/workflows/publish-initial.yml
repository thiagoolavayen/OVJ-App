name: Publish OVJ App download

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-initial.yml', 'package.json']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
      - name: Wait for the verified Windows build
        id: source
        shell: bash
        run: |
          for attempt in {1..30}; do
            run_id=$(gh run list --repo "$GH_REPO" --workflow windows.yml --commit "${{ github.sha }}" --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GH_REPO" --exit-status --interval 10
      - name: Download the Windows binaries from that build
        uses: actions/download-artifact@v4
        with:
          name: OVJ-App-Windows-x64
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: binaries
      - name: Package the installer ZIP and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib, zipfile, os
          folder = Path('binaries')
          version = os.environ['APP_VERSION']
          setup = folder / f'OVJ-App-{version}-x64-Setup-Preview.exe'
          portable = folder / f'OVJ-App-{version}-x64-Portable-Preview.exe'
          assert setup.is_file() and portable.is_file()
          archive = folder / f'OVJ-App-{version}-Instalador-Windows.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_STORED) as z:
              z.write(setup, setup.name)
              z.writestr('COMO-INSTALAR.txt', 'OVJ APP - OVEJEROS FC\n\n1. Extrae este ZIP.\n2. Abre el archivo Setup-Preview.exe.\n3. Sigue el asistente de instalacion.\n\nWindows 10/11 de 64 bits. No requiere Node.js.\nMenu superior: configuracion, pelota, Discord y diagnostico.\nF10: ajustes. F11: pantalla completa.\nPublicidad bloqueada por defecto.\n\nCompilacion preliminar sin firma. Las pruebas automatizadas no sustituyen una partida real ni benchmarks de latencia.\n')
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              assert hashlib.sha256(z.read(setup.name)).digest() == hashlib.sha256(setup.read_bytes()).digest()
          checksums = ''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in [archive, portable])
          (folder / 'SHA256SUMS.txt').write_text(checksums)
      - name: Publish the downloadable files
        shell: bash
        run: |
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            echo 'The release is already published; existing assets will stay unchanged.'
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "binaries/OVJ-App-$APP_VERSION-Instalador-Windows.zip" "binaries/OVJ-App-$APP_VERSION-x64-Portable-Preview.exe" binaries/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --target "${{ github.sha }}"
