name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify application and branding
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Component tests failed" }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "Syntax checks failed" }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { throw "Packaged application smoke test failed" }
          node tools/set-branding.cjs --check
          if ($LASTEXITCODE -ne 0) { throw "Original branding check failed" }
      - name: Build installer and portable app
        run: |
          npm run dist:win:preview -- --installer
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          if (-not (Test-Path "dist-preview/*-Setup-Preview.exe")) { throw "Installer missing" }
          if (-not (Test-Path "dist-preview/*-Portable-Preview.exe")) { throw "Portable missing" }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Keep local build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OVJ-App-Windows-x64
          path: |
            dist-preview/*-Setup-Preview.exe
            dist-preview/*-Portable-Preview.exe
            dist-preview/preview-build-report.json
          if-no-files-found: error
          retention-days: 14
